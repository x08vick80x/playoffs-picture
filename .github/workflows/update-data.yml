name: Update NFL Standings

on:
  schedule:
    # Run at 06:00 UTC (approx 7AM CET) on Friday, Monday, Tuesday
    # Friday morning (for Thursday Night Football)
    - cron: '0 6 * * 5'
    # Monday morning (for Sunday games)
    - cron: '0 6 * * 1'
    # Tuesday morning (for Monday Night Football)
    - cron: '0 6 * * 2'
    # Power rankings: Tuesday at 18:17 Paris time in summer (17:17 in winter).
    # Avoid the start of the hour, when GitHub's scheduler is busiest.
    - cron: '17 16 * * 2'
    # Second attempt at 20:17 in summer (19:17 in winter), including late publication.
    - cron: '17 18 * * 2'
    # Sunday evening (22:30 CET / 21:30 UTC)
    - cron: '30 21 * * 0'
    # Monday morning middle of night (01:30 CET / 00:30 UTC)
    - cron: '30 0 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        run: npm run update-data

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update standings data [skip ci]"
          file_pattern: "src/data/*.json"
          branch: ${{ github.head_ref }}
